<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D সৌরজগৎ (CDN)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; }
        canvas { display: block; }
    </style>
</head>
<body>

<!-- ইম্পোর্ট ম্যাপ ব্যবহার করে অফিসিয়াল cdnjs এবং unpkg CDN সেট করা হচ্ছে -->
<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com"
    }
  }
</script>

<script type="module">
    // CDN থেকে সরাসরি Three.js মডিউল ইম্পোর্ট করা হচ্ছে
    import * as THREE from 'three';

    // ১. সিন, ক্যামেরা ও রেন্ডারার তৈরি
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // ২. আলো যোগ করা
    const ambientLight = new THREE.AmbientLight(0x555555);
    scene.add(ambientLight);
    const pointLight = new THREE.PointLight(0xffffff, 2, 300);
    scene.add(pointLight);

    // ৩. সূর্য তৈরি
    const sunGeometry = new THREE.SphereGeometry(4, 32, 32);
    const sunMaterial = new THREE.MeshBasicMaterial({ color: 0xffd700 });
    const sun = new THREE.Mesh(sunGeometry, sunMaterial);
    scene.add(sun);

    // ৪. গ্রহের ডেটা (আকার, রঙ, দূরত্ব, গতি)
    const planetData = [
        { radius: 0.6, color: 0xaaaaaa, distance: 8,  speed: 0.03 },  // বুধ
        { radius: 1.0, color: 0xe3bb76, distance: 12, speed: 0.02 },  // শুক্র
        { radius: 1.2, color: 0x2233ff, distance: 16, speed: 0.015 }, // পৃথিবী
        { radius: 0.8, color: 0xff3300, distance: 21, speed: 0.01 }   // মঙ্গল
    ];

    const planets = [];

    // ৫. লুপের মাধ্যমে গ্রহ তৈরি
    planetData.forEach(data => {
        const geometry = new THREE.SphereGeometry(data.radius, 32, 32);
        const material = new THREE.MeshStandardMaterial({ color: data.color });
        const mesh = new THREE.Mesh(geometry, material);
        
        const orbit = new THREE.Object3D();
        scene.add(orbit);
        
        mesh.position.x = data.distance;
        orbit.add(mesh);
        
        planets.push({ mesh: mesh, orbit: orbit, speed: data.speed });
    });

    camera.position.z = 35;
    camera.position.y = 15;
    camera.lookAt(scene.position);

    // ৬. অ্যানিমেশন লুপ
    function animate() {
        requestAnimationFrame(animate);

        sun.rotation.y += 0.002;

        planets.forEach(p => {
            p.orbit.rotation.y += p.speed;
            p.mesh.rotation.y += 0.02;
        });

        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
